{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="toasts" role="status" aria-live="polite">
      {% for category, message in messages %}
        <div class="toast toast-{{ category }}" data-autohide>{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
