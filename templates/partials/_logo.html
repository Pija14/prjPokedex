{# Logo próprio do CardDex: um "dispositivo" com lente azul e LEDs — inspirado em Pokédex, sem usar marca oficial. #}
<svg class="logo-mark" viewBox="0 0 48 48" width="{{ size|default(40) }}" height="{{ size|default(40) }}" aria-hidden="true">
  <defs>
    <linearGradient id="lg-body-{{ uid|default('a') }}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a4e"/><stop offset="1" stop-color="#c81e2b"/>
    </linearGradient>
    <radialGradient id="lg-lens-{{ uid|default('a') }}" cx=".38" cy=".35" r=".7">
      <stop offset="0" stop-color="#8fd3ff"/><stop offset=".55" stop-color="#2f7cf6"/><stop offset="1" stop-color="#1846a8"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#lg-body-{{ uid|default('a') }})"/>
  <path d="M2 30h44v4a12 12 0 0 1-12 12H14A12 12 0 0 1 2 34z" fill="#9e1520" opacity=".45"/>
  <circle cx="17" cy="18" r="10" fill="#fff"/>
  <circle cx="17" cy="18" r="7.4" fill="url(#lg-lens-{{ uid|default('a') }})"/>
  <circle cx="14.4" cy="15.2" r="2.2" fill="#fff" opacity=".85"/>
  <circle cx="32" cy="11" r="2.6" fill="#ffd23f" stroke="#7a1018" stroke-width=".8"/>
  <circle cx="39" cy="11" r="2.6" fill="#4cd07d" stroke="#7a1018" stroke-width=".8"/>
  <rect x="28" y="24" width="14" height="10" rx="2.5" fill="#1d2433"/>
  <rect x="30.5" y="26.5" width="6" height="1.6" rx=".8" fill="#4cd07d"/>
  <rect x="30.5" y="29.5" width="9" height="1.6" rx=".8" fill="#4cd07d" opacity=".55"/>
</svg>
